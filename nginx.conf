server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_min_length   512;
    gzip_types        text/css application/javascript text/html;

    # index.html is the only file that names the others, so it must never be
    # served stale — otherwise a deploy can pair new markup with cached JS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
